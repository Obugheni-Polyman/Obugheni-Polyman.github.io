## Our Services

### 1. Consulting
Strategic advisory for schools, NGOs, and organizations. We help you design programs, improve operations, and implement policy that works on the ground.

### 2. Research
Academic and field research design, data collection, analysis, and reporting. From proposals to published papers, we handle the full process.

### 3. Special Education Services
Assessment, intervention planning, and training for learners with diverse needs. We work with parents, schools, and therapists to build inclusive learning environments.

